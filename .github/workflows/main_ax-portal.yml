# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - ax-portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install, build, and test
        run: npm ci && npm test

      - name: Prepare Next.js standalone package
        run: |
          mkdir -p deployment/.next
          cp -R .next/standalone/. deployment/
          cp -R .next/static deployment/.next/static
          if [ -d public ]; then cp -R public deployment/public; fi
          rm -f deployment/.env deployment/.env.*
          node -e "const fs=require('fs'); const file='deployment/package.json'; const pkg=JSON.parse(fs.readFileSync(file,'utf8')); pkg.scripts={start:'node server.js'}; fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deployment/
          include-hidden-files: true
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deployment
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5F7C278FB4FB48ADABD0F81AE9CE1DD9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CDBA0EB0AD4045C092409F6919E2846C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4EBB9B2D96B142DDB91AF3F2B6E9D067 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ax-portal'
          slot-name: 'Production'
          package: deployment
