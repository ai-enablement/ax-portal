const AppCtx = createContext({ isAdmin: false, members: SEED_MEMBERS, depts: SEED_DEPTS, settings: DEFAULT_SETTINGS });
const useApp = () => useContext(AppCtx);

const status = (id) => STATUSES.find((s) => s.id === id) || STATUSES[0];
const priority = (id) => PRIORITIES.find((p) => p.id === id) || PRIORITIES[1];
const fmt = (d) => (d ? `${Number(d.slice(5, 7))}월 ${Number(d.slice(8, 10))}일` : "-");
const range = (a, b) => (a && b ? `${fmt(a)} → ${fmt(b)}` : fmt(a || b));

function rollup(p) {
  const items = p.items || [];
  if (items.length === 0) return { progress: p.progress, start: p.start, due: p.due, done: 0, total: 0 };
  return {
    progress: Math.round(items.reduce((s, i) => s + i.progress, 0) / items.length),
    start: items.map((i) => i.start).sort()[0],
    due: items.map((i) => i.due).sort().slice(-1)[0],
    done: items.filter((i) => i.status === "done").length,
    total: items.length,
  };
}

function useMember() {
  const { members } = useApp();
  return (id) => members.find((m) => m.id === id) || members[0];
}
function useDept() {
  const { depts } = useApp();
  return (id) => depts.find((d) => d.id === id) || depts[0] || { id: "", name: "미지정", contact: "-" };
}

function Avatar({ id, name, size = "sm" }) {
  const { members } = useApp();
  const m = id ? members.find((x) => x.id === id) : members.find((x) => x.name === name);

  const box = size === "lg" ? "w-11 h-11 text-sm" : size === "md" ? "w-8 h-8 text-xs" : "w-6 h-6 text-xs";
  return <span className={`${box} ${tone} rounded-full inline-flex items-center justify-center font-medium shrink-0`}>{label}</span>;
}

function Chip({ className, children }) {

function SearchModal({ projects, onGo, onClose }) {
  const { members, depts } = useApp();
  const [q, setQ] = useState("");
  const [cursor, setCursor] = useState(0);
  const term = q.trim().toLowerCase();

  const results = useMemo(() => {
    if (!term) return [];
    const out = [];
    projects.forEach((p) => {
      const owner = members.find((m) => m.id === p.owner);
      if ((p.title || "").toLowerCase().includes(term) || (p.body || "").toLowerCase().includes(term)) {
        out.push({ kind: "project", key: `p${p.id}`, icon: "📁", title: p.title || "제목 없음", sub: `프로젝트 · ${owner ? owner.name : ""}`, go: { type: "project", pid: p.id, iid: null } });
      }
      (p.items || []).forEach((i) => {
        if ((i.title || "").toLowerCase().includes(term) || (i.body || "").toLowerCase().includes(term)) {
          out.push({ kind: "item", key: `p${p.id}i${i.id}`, icon: "📄", title: i.title || "제목 없음", sub: `하위 항목 · ${p.title}`, go: { type: "project", pid: p.id, iid: i.id } });
        }
      });
    });
    members.forEach((m) => {
      if (m.name.toLowerCase().includes(term) || m.role.toLowerCase().includes(term) || m.email.toLowerCase().includes(term)) {
        out.push({ kind: "member", key: `m${m.id}`, icon: m.emoji, title: m.name, sub: `팀원 · ${m.role}`, go: { type: "member", id: m.id } });
      }
    });
    depts.forEach((d) => {
      if (d.name.toLowerCase().includes(term) || (d.contact || "").toLowerCase().includes(term)) {
        out.push({ kind: "dept", key: `d${d.id}`, icon: "🏢", title: d.name, sub: `유관 부서 · ${d.contact}`, go: { type: "dept" } });
      }
    });
    return out.slice(0, 20);
  }, [term, projects, members, depts]);

  useEffect(() => setCursor(0), [term]);

  const onKey = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setCursor((c) => Math.min(c + 1, results.length - 1)); }
    if (e.key === "ArrowUp") { e.preventDefault(); setCursor((c) => Math.max(c - 1, 0)); }
    if (e.key === "Enter" && results[cursor]) onGo(results[cursor].go);
    if (e.key === "Escape") onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center pt-24 px-4 bg-stone-900 bg-opacity-40" onClick={onClose}>
      <div className="w-full max-w-xl bg-white rounded-lg shadow-xl overflow-hidden" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center gap-2 px-4 border-b border-stone-200">
          <Search className="w-4 h-4 text-stone-400 shrink-0" />
          <input autoFocus value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={onKey}
            placeholder="프로젝트, 하위 항목, 팀원, 부서 검색"
            className="flex-1 py-3 text-sm text-stone-800 focus:outline-none placeholder-stone-400" />
          <kbd className="text-xs text-stone-400 border border-stone-200 rounded px-1.5 py-0.5">Esc</kbd>
        </div>

        <div className="max-h-96 overflow-y-auto">
          {!term && (
            <p className="px-4 py-8 text-sm text-stone-400 text-center">
              검색어를 입력하세요. 본문 내용까지 함께 찾습니다.
            </p>
          )}
          {term && results.length === 0 && (
            <p className="px-4 py-8 text-sm text-stone-400 text-center">일치하는 항목이 없습니다.</p>
          )}
          {results.map((r, i) => (
            <button key={r.key} onClick={() => onGo(r.go)} onMouseEnter={() => setCursor(i)}
              className={`w-full flex items-center gap-3 px-4 py-2.5 text-left ${i === cursor ? "bg-stone-100" : "hover:bg-stone-50"}`}>
              <span className="w-5 text-center shrink-0">{r.icon}</span>
              <span className="flex-1 min-w-0">
                <span className="block text-sm text-stone-800 truncate">{r.title}</span>
                <span className="block text-xs text-stone-500 truncate">{r.sub}</span>
              </span>
              {i === cursor && <CornerDownLeft className="w-3.5 h-3.5 text-stone-400 shrink-0" />}
            </button>
          ))}
        </div>

        {results.length > 0 && (
          <div className="px-4 py-2 border-t border-stone-200 text-xs text-stone-400">
            ↑↓ 이동 · Enter 열기 · 결과 {results.length}건
          </div>
        )}
      </div>
    </div>
  );
}

                  {!isItem && roll.total > 0 && <span className="text-xs text-stone-400 ml-2">하위 항목 기준 자동 계산</span>}
                </span>
              )}
            </PropRow>

            <PropRow icon={Layers} label="진행률">

                <div className="py-1.5">
                  <input type="range" min="0" max="100" step="5" className="w-full accent-stone-800" value={node.progress} onChange={(e) => patch("progress", Number(e.target.value))} />
                  <span className="text-xs text-stone-500">{node.progress}%</span>
                </div>
              ) : (
                <div className="py-2"><Progress value={isItem ? node.progress : roll.progress} bar={pal.bar} /></div>
              )}
            </PropRow>

            {!isItem && (
              <PropRow icon={Star} label="우선순위">
                {isAdmin ? (
                  <select className={FIELD} value={project.priority} onChange={(e) => patch("priority", e.target.value)}>
                    {PRIORITIES.map((p) => <option key={p.id} value={p.id}>{p.label}</option>)}
                  </select>
                ) : (
                  <span className="py-1.5 block"><Chip className={priority(project.priority).chip}>{priority(project.priority).label}</Chip></span>
                )}
              </PropRow>
            )}
          </div>

          <hr className="border-stone-200 mb-6" />

          {isAdmin ? (
            <textarea value={node.body || ""} onChange={(e) => patch("body", e.target.value)}
              placeholder="내용을 입력하세요. 회의 메모, 진행 상황, 참고 링크 등 자유롭게 작성할 수 있습니다."
              className="w-full min-h-40 text-sm text-stone-700 leading-relaxed focus:outline-none placeholder-stone-300 resize-y" />
          ) : node.body ? (
            <p className="text-sm text-stone-700 leading-relaxed whitespace-pre-wrap">{node.body}</p>
          ) : (
            <p className="text-sm text-stone-400">작성된 내용이 없습니다.</p>
          )}

          {!isItem && (
            <div className="mt-10">
              <div className="flex items-center justify-between mb-2">
                <h4 className="text-sm font-semibold text-stone-800">하위 항목</h4>
                <span className="text-xs text-stone-400">{roll.total > 0 ? `${roll.done} / ${roll.total} 완료` : "없음"}</span>
              </div>
              <div className="border border-stone-200 rounded-lg divide-y divide-stone-100">
                {(project.items || []).map((i) => (
                  <button key={i.id} onClick={() => onOpenItem(i.id)} className="w-full px-3 py-2.5 flex items-center gap-3 hover:bg-stone-50 text-left">
                    <FileText className="w-4 h-4 text-stone-400 shrink-0" />
                    <span className="text-sm text-stone-800 flex-1 truncate">{i.title || "제목 없음"}</span>
                    <span className="text-xs text-stone-500 whitespace-nowrap hidden sm:block">{range(i.start, i.due)}</span>
                    <Chip className={status(i.status).chip}><span className={`w-1.5 h-1.5 rounded-full ${status(i.status).dot}`} />{status(i.status).label}</Chip>
                    <span className="w-20 shrink-0"><Progress value={i.progress} bar={pal.bar} showLabel={false} /></span>
                  </button>
                ))}
                {(project.items || []).length === 0 && <p className="px-3 py-4 text-sm text-stone-400">아직 하위 항목이 없습니다.</p>}
                {isAdmin && (
                  <button onClick={() => onOpenItem(actions.addItem(project.id))} className="w-full px-3 py-2.5 flex items-center gap-2 text-sm text-stone-500 hover:bg-stone-50">
                    <Plus className="w-4 h-4" /> 새 하위 항목
                  </button>
                )}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ProjectTable({ rows, onOpen, sort, setSort, grouped, actions }) {
  const { isAdmin, members } = useApp();
  const findMember = useMember();
  const findDept = useDept();
  const [expanded, setExpanded] = useState(() => new Set(rows.filter((r) => (r.items || []).length).map((r) => r.id)));
  const [closedGroups, setClosedGroups] = useState(() => new Set());

  const toggle = (id) => { const n = new Set(expanded); n.has(id) ? n.delete(id) : n.add(id); setExpanded(n); };
  const toggleGroup = (id) => { const n = new Set(closedGroups); n.has(id) ? n.delete(id) : n.add(id); setClosedGroups(n); };

  const th = "px-3 py-2 text-left text-xs font-medium text-stone-500 border-b border-stone-200";

    <button onClick={() => setSort(sort === key ? "" : key)} className={`flex items-center gap-1 hover:text-stone-800 ${sort === key ? "text-stone-800" : ""}`}>

    list.map((p) => {
      const mb = findMember(p.owner), dp = findDept(p.dept), st = status(p.status);

                </button>
                <button onClick={() => onOpen(p.id, null)} className="flex items-center gap-1.5 text-sm text-stone-800 font-medium text-left hover:underline">
                  <FileText className="w-3.5 h-3.5 text-stone-400 shrink-0" /> {p.title || "제목 없음"}
                </button>
                {items.length > 0 && <span className="text-xs text-stone-400 shrink-0 ml-1">{roll.done}/{roll.total}</span>}

            </td>
            <td className="px-3 py-2.5"><span className="flex items-center gap-1.5 text-sm text-stone-700 whitespace-nowrap"><Avatar id={p.owner} /> {mb.name}</span></td>
            <td className="px-3 py-2.5"><Chip className={DEPT_CHIP}>{dp.name}</Chip></td>
            <td className={`px-3 py-2.5 text-sm whitespace-nowrap ${late ? "text-rose-600 font-medium" : "text-stone-600"}`}>{range(roll.start, roll.due)}</td>
            <td className="px-3 py-2.5"><Chip className={st.chip}><span className={`w-1.5 h-1.5 rounded-full ${st.dot}`} />{st.label}</Chip></td>
            <td className="px-3 py-2.5"><Progress value={roll.progress} bar={pal.bar} /></td>
          </tr>

                <td className="px-3 py-2"><span className="flex items-center gap-1.5 text-sm text-stone-600 whitespace-nowrap"><Avatar id={p.owner} /> {mb.name}</span></td>
                <td className="px-3 py-2"><Chip className={DEPT_CHIP}>{dp.name}</Chip></td>
                <td className={`px-3 py-2 text-sm whitespace-nowrap ${ilate ? "text-rose-600" : "text-stone-500"}`}>{range(i.start, i.due)}</td>
                <td className="px-3 py-2"><Chip className={ist.chip}><span className={`w-1.5 h-1.5 rounded-full ${ist.dot}`} />{ist.label}</Chip></td>
                <td className="px-3 py-2"><Progress value={i.progress} bar={pal.bar} /></td>
              </tr>

          })}

            <tr className="border-b border-stone-100">
              <td colSpan={6} className="px-3 py-1.5">

              </td>

          )}

    return (
      <div className="border border-dashed border-stone-300 rounded-lg py-12 text-center">
        <p className="text-sm text-stone-500">조건에 맞는 프로젝트가 없습니다.</p>
        <p className="text-xs text-stone-400 mt-1">필터를 바꿔 다시 찾아보세요.</p>
      </div>
    );
  }

  if (!grouped) {
    return (
      <div className="border border-stone-200 rounded-lg overflow-x-auto">
        <table className="w-full min-w-max">{header}<tbody>{renderRows(rows)}</tbody></table>
      </div>
    );
  }

  const groups = members.map((m) => ({ m, list: rows.filter((p) => p.owner === m.id) })).filter((g) => g.list.length > 0);

  return (
    <div className="space-y-4">
      {groups.map(({ m, list }) => {
        const closed = closedGroups.has(m.id);
        return (
          <div key={m.id}>
            <div className="flex items-center gap-2 mb-1.5">
              <button onClick={() => toggleGroup(m.id)} className="p-0.5 rounded text-stone-400 hover:bg-stone-200" aria-label="그룹 접기">
                {closed ? <ChevronRight className="w-4 h-4" /> : <ChevronDown className="w-4 h-4" />}
              </button>
              <Avatar id={m.id} />
              <span className="text-sm font-semibold text-stone-800">{m.name}</span>
              <span className="text-xs text-stone-400">{list.length}</span>
              {isAdmin && (
                <button onClick={() => onOpen(actions.addProject(m.id), null)} className="p-1 rounded text-stone-400 hover:bg-stone-200" aria-label="프로젝트 추가">
                  <Plus className="w-3.5 h-3.5" />
                </button>
              )}
            </div>
            {!closed && (
              <div className="border border-stone-200 rounded-lg overflow-x-auto">
                <table className="w-full min-w-max">{header}<tbody>{renderRows(list)}</tbody></table>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function MonthCalendar({ rows, onOpen }) {
  const findMember = useMember();
  const [cursor, setCursor] = useState({ y: 2026, m: 7 });
  const { y, m } = cursor;

  const events = useMemo(() => {
    const out = [];
    rows.forEach((p) => {
      const items = p.items || [];
      if (items.length) items.forEach((i) => out.push({ key: `${p.id}-${i.id}`, pid: p.id, iid: i.id, title: i.title || "제목 없음", due: i.due, owner: p.owner }));
      else out.push({ key: `${p.id}`, pid: p.id, iid: null, title: p.title || "제목 없음", due: p.due, owner: p.owner });
    });
    return out;
  }, [rows]);

  const grid = useMemo(() => {
    const startPad = new Date(y, m - 1, 1).getDay();
    const days = new Date(y, m, 0).getDate();
    const cells = [];
    for (let i = 0; i < startPad; i++) cells.push(null);
    for (let d = 1; d <= days; d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(null);
    return cells;
  }, [y, m]);

  const key = (d) => `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  const shift = (delta) => {
    let nm = m + delta, ny = y;
    if (nm > 12) { nm = 1; ny++; }
    if (nm < 1) { nm = 12; ny--; }
    setCursor({ y: ny, m: nm });
  };

  return (
    <div className="border border-stone-200 rounded-lg overflow-hidden">
      <div className="flex items-center justify-between px-4 py-2.5 border-b border-stone-200 bg-stone-50">
        <h4 className="text-sm font-semibold text-stone-800">{y}년 {m}월</h4>
        <div className="flex items-center gap-1">
          <button onClick={() => shift(-1)} className="p-1.5 rounded hover:bg-stone-200 text-stone-600" aria-label="이전 달"><ChevronLeft className="w-4 h-4" /></button>
          <button onClick={() => setCursor({ y: 2026, m: 7 })} className="px-2 py-1 rounded text-xs text-stone-600 hover:bg-stone-200">오늘</button>
          <button onClick={() => shift(1)} className="p-1.5 rounded hover:bg-stone-200 text-stone-600" aria-label="다음 달"><ChevronRight className="w-4 h-4" /></button>
        </div>
      </div>

      <div className="grid grid-cols-7 border-b border-stone-200 bg-stone-50">
        {["일", "월", "화", "수", "목", "금", "토"].map((d, i) => (
          <div key={d} className={`py-1.5 text-center text-xs font-medium ${i === 0 ? "text-rose-500" : i === 6 ? "text-blue-500" : "text-stone-500"}`}>{d}</div>
        ))}
      </div>

      <div className="grid grid-cols-7">
        {grid.map((d, i) => {
          const dk = d ? key(d) : null;
          const dayEvents = d ? events.filter((e) => e.due === dk) : [];
          const isToday = dk === TODAY;
          return (
            <div key={i} className={`min-h-24 border-b border-r border-stone-100 p-1.5 ${d ? "bg-white" : "bg-stone-50"}`}>
              {d && (
                <>
                  <span className={`inline-flex items-center justify-center w-5 h-5 text-xs mb-1 rounded-full ${isToday ? "bg-stone-800 text-white font-semibold" : i % 7 === 0 ? "text-rose-500" : "text-stone-500"}`}>{d}</span>
                  <div className="space-y-1">
                    {dayEvents.map((e) => (
                      <button key={e.key} onClick={() => onOpen && onOpen(e.pid, e.iid)}
                        className={`w-full text-left text-xs px-1.5 py-0.5 rounded border truncate ${palette(findMember(e.owner).color).tint}`}>
                        {e.title}
                      </button>
                    ))}
                  </div>
                </>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ProjectDatabase({ projects, setProjects, fixedOwner = null, title = "팀원별 프로젝트 현황", focus = null }) {
  const { isAdmin, members, depts, settings } = useApp();
  const [view, setView] = useState(settings.defaultView);
  const [grouped, setGrouped] = useState(settings.defaultGroup === "owner" && !fixedOwner);
  const [groupBy, setGroupBy] = useState("status");
  const [q, setQ] = useState("");
  const [fOwner, setFOwner] = useState("all");
  const [fDept, setFDept] = useState("all");
  const [fStatus, setFStatus] = useState("all");
  const [sort, setSort] = useState("");
  const [open, setOpen] = useState(null);

  useEffect(() => { if (focus) setOpen({ pid: focus.pid, iid: focus.iid }); }, [focus]);

  const rows = useMemo(() => {
    let r = projects.filter((p) => {
      if (fixedOwner && p.owner !== fixedOwner) return false;
      if (!fixedOwner && fOwner !== "all" && p.owner !== fOwner) return false;
      if (fDept !== "all" && p.dept !== fDept) return false;
      if (fStatus !== "all" && p.status !== fStatus) return false;
      if (q.trim()) {
        const t = q.trim().toLowerCase();
        if (!((p.title || "").toLowerCase().includes(t) || (p.items || []).some((i) => (i.title || "").toLowerCase().includes(t)))) return false;
      }
      return true;
    });
    if (sort === "due") r = [...r].sort((a, b) => rollup(a).due.localeCompare(rollup(b).due));
    if (sort === "progress") r = [...r].sort((a, b) => rollup(b).progress - rollup(a).progress);
    return r;
  }, [projects, q, fOwner, fDept, fStatus, sort, fixedOwner]);

  const actions = {
    updateProject: (id, patch) => setProjects(projects.map((p) => (p.id === id ? { ...p, ...patch } : p))),
    updateItem: (pid, iid, patch) => setProjects(projects.map((p) => (p.id === pid ? { ...p, items: p.items.map((i) => (i.id === iid ? { ...i, ...patch } : i)) } : p))),
    addItem: (pid) => {
      const iid = `i${Date.now()}`;
      setProjects(projects.map((p) => (p.id === pid ? { ...p, items: [...(p.items || []), { id: iid, title: "", status: "todo", start: TODAY, due: TODAY, progress: 0, body: "" }] } : p)));
      return iid;
    },
    removeItem: (pid, iid) => setProjects(projects.map((p) => (p.id === pid ? { ...p, items: p.items.filter((i) => i.id !== iid) } : p))),
    addProject: (ownerId) => {
      const id = Date.now();
      setProjects([...projects, { id, title: "", owner: ownerId || fixedOwner || members[0].id, dept: depts[0].id, status: "todo", priority: "mid", start: TODAY, due: TODAY, progress: 0, body: "", items: [] }]);
      return id;
    },
    removeProject: (id) => setProjects(projects.filter((p) => p.id !== id)),
    move: (id, st) => setProjects(projects.map((p) => (p.id === id ? { ...p, status: st } : p))),
  };

  const openProject = open ? projects.find((p) => p.id === open.pid) : null;
  const openItem = openProject && open.iid ? (openProject.items || []).find((i) => i.id === open.iid) : null;

  const viewBtn = (id, Icon, label) => (
    <button onClick={() => setView(id)}
      className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded text-sm transition-colors ${view === id ? "bg-white text-stone-900 shadow-sm font-medium" : "text-stone-500 hover:text-stone-800"}`}>
      <Icon className="w-4 h-4" /> {label}
    </button>
  );

  return (
    <section className="space-y-3">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <h3 className="text-lg font-semibold text-stone-800">{title}</h3>
        {isAdmin && (
          <button onClick={() => setOpen({ pid: actions.addProject(fixedOwner), iid: null })}
            className="flex items-center gap-1.5 px-3 py-1.5 rounded bg-stone-800 text-white text-sm hover:bg-stone-700">
            <Plus className="w-4 h-4" /> 새 프로젝트
          </button>
        )}
      </div>

      <div className="flex items-center gap-2 flex-wrap">

      {view === "table" && <ProjectTable rows={rows} onOpen={(pid, iid) => setOpen({ pid, iid })} sort={sort} setSort={setSort} grouped={grouped && !fixedOwner} actions={actions} />}
      {view === "board" && <ProjectBoard rows={rows} onOpen={(pid, iid) => setOpen({ pid, iid })} onMove={actions.move} groupBy={fixedOwner ? "status" : groupBy} />}
      {view === "calendar" && <MonthCalendar rows={rows} onOpen={(pid, iid) => setOpen({ pid, iid })} />}

      {openProject && (
        <DetailPanel project={openProject} item={openItem} actions={actions}
          onOpenItem={(iid) => setOpen({ pid: open.pid, iid })} onClose={() => setOpen(null)} />
      )}
    </section>
  );
}

/* 타임라인 (팀원별 프로젝트 진행률)                                     */
/* ------------------------------------------------------------------ */

const DAY_W = 26;
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dayDiff = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);

function Blocks({ value, bar }) {
  const filled = Math.round(value / 10);
  return (
    <span className="flex gap-0.5 shrink-0">
      {Array.from({ length: 10 }).map((_, i) => (
        <span key={i} className={`w-2 h-2 rounded-sm ${i < filled ? bar : "bg-stone-200"}`} />
      ))}
    </span>
  );
}

const LABEL_W = 136;

function Timeline({ projects, onOpen, mode = "member" }) {
  const { members, depts } = useApp();
  const scroller = React.useRef(null);

  /* 레인: 팀원 또는 유관 부서 */
  const lanes = useMemo(() => (
    mode === "dept"
      ? depts.map((d, i) => ({ id: d.id, name: d.name, color: PALETTES[i % PALETTES.length].id, memberId: null }))
      : members.map((m) => ({ id: m.id, name: m.name, color: m.color, memberId: m.id }))
  ), [mode, members, depts]);

  const laneKey = (p) => (mode === "dept" ? p.dept : p.owner);

  const [selected, setSelected] = useState(() => new Set(lanes.map((l) => l.id)));
  useEffect(() => { setSelected(new Set(lanes.map((l) => l.id))); }, [lanes]);

  const rows = useMemo(() => {
    const order = new Map(lanes.map((l, i) => [l.id, i]));
    return projects
      .filter((p) => selected.has(laneKey(p)))
      .sort((a, b) => (order.get(laneKey(a)) - order.get(laneKey(b))) || String(rollup(a).start).localeCompare(String(rollup(b).start)));
  }, [projects, selected, lanes, mode]);

  const bounds = useMemo(() => {
    const dates = [TODAY];
    (rows.length ? rows : projects).forEach((p) => { const r = rollup(p); if (r.start) dates.push(r.start); if (r.due) dates.push(r.due); });
    const sorted = [...dates].sort();
    const first = new Date(sorted[0] + "T00:00:00");
    const last = new Date(sorted[sorted.length - 1] + "T00:00:00");
    const s = iso(new Date(first.getFullYear(), first.getMonth(), 1));
    const e = iso(new Date(last.getFullYear(), last.getMonth() + 1, 0));
    return { start: s, end: e, total: dayDiff(s, e) + 1 };
  }, [rows, projects]);

  const months = useMemo(() => {
    const out = [];
    let cur = new Date(bounds.start + "T00:00:00");
    const stop = new Date(bounds.end + "T00:00:00");
    while (cur <= stop) {
      const y = cur.getFullYear(), mo = cur.getMonth();
      const monthEnd = new Date(y, mo + 1, 0);
      const from = iso(cur) < bounds.start ? bounds.start : iso(cur);
      const to = iso(monthEnd) > bounds.end ? bounds.end : iso(monthEnd);
      out.push({ key: `${y}-${mo}`, label: out.length === 0 ? `${y}년 ${mo + 1}월` : `${mo + 1}월`, days: dayDiff(from, to) + 1 });
      cur = new Date(y, mo + 1, 1);
    }
    return out;
  }, [bounds]);

  const days = useMemo(() => {
    const out = [];
    const base = new Date(bounds.start + "T00:00:00").getTime();
    for (let i = 0; i < bounds.total; i++) {
      const d = new Date(base + i * 86400000);
      out.push({ i, day: d.getDate(), dow: d.getDay(), key: iso(d) });
    }
    return out;
  }, [bounds]);

  const todayOffset = dayDiff(bounds.start, TODAY);
  useEffect(() => {
    if (scroller.current) scroller.current.scrollLeft = Math.max(0, (todayOffset - 6) * DAY_W);
  }, [todayOffset]);

  const toggle = (id) => {
    const n = new Set(selected);
    n.has(id) ? n.delete(id) : n.add(id);
    setSelected(n.size ? n : new Set(lanes.map((l) => l.id)));
  };
  const allOn = selected.size === lanes.length;
  const trackW = bounds.total * DAY_W;
  const laneLabel = mode === "dept" ? "유관 부서" : "담당자";

  return (
    <div className="space-y-2">
      {/* 필터 */}
      <div className="flex items-center gap-1.5 flex-wrap">
        <button onClick={() => setSelected(new Set(lanes.map((l) => l.id)))}
          className={`px-2.5 py-1 rounded-full border text-xs transition-colors ${allOn ? "bg-stone-800 text-white border-stone-800" : "bg-white text-stone-600 border-stone-300 hover:border-stone-500"}`}>
          전체 {lanes.length}
        </button>
        {lanes.map((l) => {
          const on = selected.has(l.id);
          const pal = palette(l.color);
          const count = projects.filter((p) => laneKey(p) === l.id).length;
          if (count === 0 && mode === "dept") return null;
          return (
            <button key={l.id} onClick={() => toggle(l.id)}
              className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-xs transition-colors ${on ? pal.tint : "bg-white text-stone-400 border-stone-200"}`}>
              <span className={`w-2 h-2 rounded-full ${on ? pal.bar : "bg-stone-300"}`} />
              {l.name} <span className="tabular-nums opacity-60">{count}</span>
            </button>
          );
        })}
        <span className="ml-auto text-xs text-stone-400 tabular-nums">{rows.length}건 표시</span>
      </div>

      <div ref={scroller} className="border border-stone-200 rounded-lg overflow-auto" style={{ maxHeight: 460 }}>
        <div className="relative" style={{ width: LABEL_W + trackW, minWidth: "100%" }}>

          <div className="flex sticky top-0 z-20 bg-stone-50 border-b border-stone-200">
            <div className="sticky left-0 z-30 bg-stone-50 border-r border-stone-200 shrink-0 px-2 py-1.5 text-xs font-medium text-stone-500" style={{ width: LABEL_W }}>
              {laneLabel}
            </div>
            {months.map((mo) => (
              <div key={mo.key} style={{ width: mo.days * DAY_W }} className="px-2 py-1.5 text-xs font-medium text-stone-600 border-r border-stone-200 truncate shrink-0">
                {mo.label}
              </div>
            ))}
          </div>

          <div className="flex sticky z-20 bg-stone-50 border-b border-stone-200" style={{ top: 29 }}>
            <div className="sticky left-0 z-30 bg-stone-50 border-r border-stone-200 shrink-0" style={{ width: LABEL_W }} />
            {days.map((d) => (
              <div key={d.key} style={{ width: DAY_W }}
                className={`text-center text-xs py-1 shrink-0 ${d.key === TODAY ? "" : d.dow === 0 ? "text-rose-400" : d.dow === 6 ? "text-blue-400" : "text-stone-400"}`}>
                {d.key === TODAY
                  ? <span className="inline-flex items-center justify-center w-5 h-5 rounded-full bg-rose-500 text-white font-medium">{d.day}</span>
                  : d.day}
              </div>
            ))}
          </div>

          <div className="absolute pointer-events-none" style={{ left: LABEL_W, top: 56, bottom: 0, width: trackW }}>
            {days.filter((d) => d.dow === 0 || d.dow === 6).map((d) => (
              <div key={d.key} className="absolute top-0 bottom-0 bg-stone-50" style={{ left: d.i * DAY_W, width: DAY_W }} />
            ))}
          </div>

          <div className="absolute border-l border-rose-400 pointer-events-none" style={{ left: LABEL_W + todayOffset * DAY_W + DAY_W / 2, top: 56, bottom: 0 }} />

          <div className="relative">
            {rows.map((p, idx) => {
              const lane = lanes.find((l) => l.id === laneKey(p)) || lanes[0];
              const pal = palette(lane.color);
              const r = rollup(p);
              const off = Math.max(0, dayDiff(bounds.start, r.start));
              const span = Math.max(1, dayDiff(r.start, r.due) + 1);
              const late = r.due < TODAY && p.status !== "done";
              const firstOfLane = idx === 0 || laneKey(rows[idx - 1]) !== laneKey(p);
              return (
                <div key={p.id} className={`flex h-11 ${firstOfLane && idx > 0 ? "border-t border-stone-200" : "border-t border-stone-100"}`}>
                  <div className="sticky left-0 z-10 bg-white border-r border-stone-200 shrink-0 flex items-center gap-1.5 px-2" style={{ width: LABEL_W }}>
                    <span className={`w-1 h-6 rounded-full shrink-0 ${pal.bar}`} />
                    {firstOfLane ? (
                      <>
                        {lane.memberId
                          ? <Avatar id={lane.memberId} />
                          : <Building2 className="w-4 h-4 text-stone-400 shrink-0" />}
                        <span className="text-xs font-medium text-stone-800 truncate">{lane.name}</span>
                      </>
                    ) : (
                      <span className="text-xs text-stone-300 truncate pl-6">{lane.name}</span>
                    )}
                  </div>

                  <div className="relative shrink-0" style={{ width: trackW }}>
                    <button onClick={() => onOpen(p.id)}
                      style={{ left: off * DAY_W, width: Math.max(span * DAY_W, 200) }}
                      className={`absolute top-1.5 h-8 flex items-center gap-2 pl-1.5 pr-2 rounded border shadow-sm overflow-hidden hover:ring-2 hover:ring-stone-300 ${pal.tint} ${late ? "border-rose-400" : ""}`}>
                      <ChevronRight className="w-3 h-3 opacity-50 shrink-0" />
                      <span className="text-xs truncate flex-1 text-left">{p.title || "제목 없음"}</span>
                      <Blocks value={r.progress} bar={pal.bar} />
                      <span className="text-xs tabular-nums shrink-0 opacity-70">{r.progress}%</span>
                    </button>
                  </div>
                </div>
              );
            })}
            {rows.length === 0 && <p className="px-4 py-10 text-sm text-stone-400 text-center">선택한 항목의 프로젝트가 없습니다.</p>}
          </div>
        </div>
      </div>
    </div>
  );
}

                    <span>유관 부서 {partners.length}</span>
                  </div>
                  <Progress value={rate} bar={palette(m.color).bar} />
                </button>
              );
            })}
          </div>
        </>
      )}
    </>
  );
}

function MemberPage({ memberId, projects, setProjects, setPage, onEditMember, focus }) {
  const { isAdmin, depts } = useApp();
  const findMember = useMember();
  const m = findMember(memberId);
  const mine = projects.filter((p) => p.owner === memberId);
  const done = mine.filter((p) => p.status === "done").length;
  const rate = mine.length ? Math.round(mine.reduce((s, p) => s + rollup(p).progress, 0) / mine.length) : 0;
  const late = mine.filter((p) => rollup(p).due < TODAY && p.status !== "done").length;
  const partners = depts.filter((d) => mine.some((p) => p.dept === d.id));

  return (
    <div className="space-y-8">
      <button onClick={() => setPage("home")} className="flex items-center gap-1.5 text-sm text-stone-500 hover:text-stone-800">
        <ArrowLeft className="w-4 h-4" /> 팀원별 페이지
      </button>

      <div className="border border-stone-200 rounded-lg p-4 flex items-center gap-4 flex-wrap">
        <Avatar id={m.id} size="lg" />
        <div>
          <p className="text-sm font-medium text-stone-800">{m.name} · {m.role}</p>
          <p className="text-xs text-stone-500 flex items-center gap-1.5 mt-0.5"><Mail className="w-3 h-3" /> {m.email}</p>
        </div>
        {isAdmin && (
          <button onClick={() => onEditMember(m)} className="ml-auto flex items-center gap-1.5 px-2.5 py-1.5 rounded border border-stone-300 text-sm text-stone-700 hover:bg-stone-50">
            <Pencil className="w-3.5 h-3.5" /> 정보 편집
          </button>
        )}
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <StatCard label="담당 프로젝트" value={mine.length} sub={`하위 항목 ${mine.reduce((s, p) => s + (p.items || []).length, 0)}건`} />
        <StatCard label="진행 중" value={mine.filter((p) => p.status === "doing").length} />
        <StatCard label="완료" value={done} sub={`평균 진행률 ${rate}%`} />
        <StatCard label="기한 초과" value={late} sub={late ? "일정 조정이 필요합니다" : "없습니다"} />
      </div>

      <section>
        <h3 className="text-lg font-semibold text-stone-800 mb-3">협업 중인 유관 부서</h3>
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {partners.map((d) => {
            const list = mine.filter((p) => p.dept === d.id);
            const fin = list.filter((p) => p.status === "done").length;
            return (
              <div key={d.id} className="border border-stone-200 rounded-lg p-4">
                <div className="flex items-center gap-2 mb-1">
                  <Building2 className="w-4 h-4 text-stone-500" />
                  <p className="text-sm font-medium text-stone-800">{d.name}</p>
                </div>
                <p className="text-xs text-stone-500 mb-3">요청 창구 {d.contact}</p>
                <Progress value={list.length ? Math.round(list.reduce((s, p) => s + rollup(p).progress, 0) / list.length) : 0} bar={palette(m.color).bar} />
                <p className="text-xs text-stone-400 mt-1.5">요청 {list.length}건 · 완료 {fin}건</p>
              </div>
            );
          })}
          {partners.length === 0 && <p className="text-sm text-stone-500">아직 연결된 유관 부서가 없습니다.</p>}
        </div>
      </section>

      <ProjectDatabase projects={projects} setProjects={setProjects} fixedOwner={memberId} title={`${m.name} 님의 프로젝트`} focus={focus} />
    </div>
  );
}

function DeptPage({ projects, setPage, setMemberId }) {
  const { depts } = useApp();
  const findMember = useMember();
  const active = depts.filter((d) => projects.some((p) => p.dept === d.id));
  const busiest = [...active].sort((a, b) => projects.filter((p) => p.dept === b.id).length - projects.filter((p) => p.dept === a.id).length)[0];

  return (
    <div className="space-y-8">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <StatCard label="요청 부서" value={`${active.length}개`} sub={`전체 ${depts.length}개 중`} />
        <StatCard label="접수된 요청" value={projects.length} />
        <StatCard label="검토 대기" value={projects.filter((p) => p.status === "review").length} sub="부서 확인 필요" />
        <StatCard label="최다 요청" value={busiest ? busiest.name : "-"} sub={busiest ? `${projects.filter((p) => p.dept === busiest.id).length}건` : ""} />
      </div>

      <section>
        <h3 className="text-lg font-semibold text-stone-800 mb-3">유관 부서별 요청 현황</h3>
        <div className="flex gap-3 overflow-x-auto pb-2">
          {active.map((d) => {
            const list = projects.filter((p) => p.dept === d.id);
            return (
              <div key={d.id} className="w-64 shrink-0 bg-stone-50 rounded-lg p-3">
                <div className="flex items-center justify-between mb-1 px-1">
                  <span className="text-sm font-semibold text-stone-800">{d.name}</span>
                  <span className="text-xs text-stone-400">{list.length}건</span>
                </div>
                <p className="px-1 text-xs text-stone-500 mb-3">{d.contact}</p>
                <div className="space-y-2">
                  {list.map((p) => {
                    const mb = findMember(p.owner), st = status(p.status), roll = rollup(p);
                    return (
                      <button key={p.id} onClick={() => { setMemberId(p.owner); setPage("member"); }}
                        className="w-full text-left bg-white border border-stone-200 rounded-md p-3 hover:border-stone-400">
                        <p className="text-sm font-medium text-stone-800 leading-snug mb-2">{p.title || "제목 없음"}</p>
                        <Chip className={st.chip}><span className={`w-1.5 h-1.5 rounded-full ${st.dot}`} />{st.label}</Chip>
                        <div className="flex items-center justify-between mt-2.5">
                          <span className="flex items-center gap-1.5 text-xs text-stone-600"><Avatar id={p.owner} />{mb.name}</span>
                          <span className="text-xs text-stone-500">{fmt(roll.due)}</span>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </section>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 사이드바 · 앱/* ------------------------------------------------------------------ */
/* 사이드바 · 앱                                                        */
/* ------------------------------------------------------------------ */

function Sidebar({ page, setPage, memberId, setMemberId, open, setOpen, onSearch, onSettings }) {
  const { members, settings } = useApp();
  const [treeOpen, setTreeOpen] = useState(true);
  const item = (active) =>
    `w-full flex items-center gap-2 px-2 py-1.5 rounded text-sm text-left transition-colors ${
      active ? "bg-stone-200 text-stone-900 font-medium" : "text-stone-600 hover:bg-stone-200"}`;

  return (
    <aside className={`${open ? "w-60" : "w-0"} shrink-0 bg-stone-100 border-r border-stone-200 overflow-hidden transition-all duration-200`}>
      <div className="w-60 h-full flex flex-col">
        <div className="px-3 py-3 flex items-center justify-between">
          <div className="flex items-center gap-2 min-w-0">
            <span className="w-6 h-6 rounded bg-stone-800 text-white text-xs flex items-center justify-center font-semibold shrink-0">
              {settings.teamName.slice(0, 1)}
            </span>
            <span className="text-sm font-medium text-stone-800 truncate">{settings.teamName} 워크스페이스</span>
          </div>
          <button onClick={() => setOpen(false)} className="p-1 rounded hover:bg-stone-200 text-stone-500" aria-label="사이드바 접기">
            <ChevronLeft className="w-4 h-4" />
          </button>
        </div>

        <div className="px-2 space-y-0.5">
          <button onClick={onSearch} className={item(false)}>
            <Search className="w-4 h-4" /> 검색
            <kbd className="ml-auto text-xs text-stone-400 border border-stone-300 rounded px-1">⌘K</kbd>
          </button>
          <button onClick={() => setPage("home")} className={item(page === "home")}><Home className="w-4 h-4" /> 홈</button>
          <button onClick={onSettings} className={item(false)}><Settings className="w-4 h-4" /> 설정</button>
        </div>

        <div className="mt-5 px-2 flex-1 overflow-y-auto">
          <div className="px-2 pb-1 text-xs font-semibold text-stone-400 tracking-wide">페이지</div>
          <button onClick={() => setTreeOpen(!treeOpen)} className="w-full flex items-center gap-1 px-2 py-1.5 rounded text-sm text-stone-800 hover:bg-stone-200 font-medium text-left">
            {treeOpen ? <ChevronDown className="w-3.5 h-3.5 shrink-0" /> : <ChevronRight className="w-3.5 h-3.5 shrink-0" />}
            <span>📁</span><span className="truncate">팀원별 프로젝트 관리</span>
          </button>

          {treeOpen && (
            <div className="ml-4 mt-0.5 space-y-0.5 border-l border-stone-300 pl-2">
              <button onClick={() => setPage("dept")} className={item(page === "dept")}><Building2 className="w-4 h-4" /> 유관 부서 현황</button>
              <button onClick={() => setPage("calendar")} className={item(page === "calendar")}><CalendarDays className="w-4 h-4" /> 팀 캘린더</button>
              <div className="px-2 pt-2 pb-1 text-xs font-semibold text-stone-400">팀원 페이지</div>
              {members.map((m) => (
                <button key={m.id} onClick={() => { setMemberId(m.id); setPage("member"); }} className={item(page === "member" && memberId === m.id)}>
                  <span className="w-4 text-center">{m.emoji}</span> {m.name}
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
    </aside>
  );
}

function App() {
  const [isAdmin, setIsAdmin] = useState(false);
  const [gateOpen, setGateOpen] = useState(false);
  const [members, setMembers] = useState(SEED_MEMBERS);
  const [depts, setDepts] = useState(SEED_DEPTS);
  const [projects, setProjects] = useState(SEED_PROJECTS);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [page, setPage] = useState("home");
  const [memberId, setMemberId] = useState(SEED_MEMBERS[0].id);
  const [memberEdit, setMemberEdit] = useState(null);
  const [searchOpen, setSearchOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [focus, setFocus] = useState(null);

  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); setSearchOpen(true); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const current = members.find((m) => m.id === memberId) || members[0];

  const go = (target) => {
    setSearchOpen(false);
    if (target.type === "project") {
      const p = projects.find((x) => x.id === target.pid);
      if (p) { setMemberId(p.owner); setPage("member"); setFocus({ pid: target.pid, iid: target.iid, n: Date.now() }); }
    }
    if (target.type === "member") { setMemberId(target.id); setPage("member"); }
    if (target.type === "dept") setPage("dept");
  };

  const saveMember = (m) => {
    if (m.id) setMembers(members.map((x) => (x.id === m.id ? m : x)));
    else {
      const id = `m${Date.now()}`;
      setMembers([...members, { ...m, id }]);
      setMemberId(id);
    }
    setMemberEdit(null);
  };
  const removeMember = (id) => {
    if (members.length <= 1) return;
    const rest = members.filter((m) => m.id !== id);
    setMembers(rest);
    setProjects(projects.filter((p) => p.owner !== id));
    if (memberId === id) { setMemberId(rest[0].id); setPage("home"); }
    setMemberEdit(null);
  };

  const openProject = (pid, iid = null) => {
    const p = projects.find((x) => x.id === pid);
    if (p) { setMemberId(p.owner); setPage("member"); setFocus({ pid, iid, n: Date.now() }); }
  };

  const crumbs = { home: "팀원별 프로젝트 관리", dept: "유관 부서 현황", calendar: "팀 캘린더", member: current.name };
  const heading = {
    home: { icon: "📁", title: "팀원별 프로젝트 관리", sub: `${settings.teamName} · Member-Based Project Management` },
    dept: { icon: "🏢", title: "유관 부서 현황", sub: "부서에서 요청한 프로젝트 한눈에" },
    calendar: { icon: "🗓", title: "팀 캘린더", sub: "프로젝트와 단위 작업 마감 한눈에" },
    member: { icon: current.emoji, title: current.name, sub: current.role },
  }[page];

  const roleBtn = (admin, Icon, label) => (
    <button onClick={() => { if (admin) { if (!isAdmin) setGateOpen(true); } else setIsAdmin(false); }}
      className={`flex items-center gap-1.5 px-2.5 py-1 rounded text-xs transition-colors ${isAdmin === admin ? "bg-white text-stone-900 shadow-sm font-medium" : "text-stone-500 hover:text-stone-800"}`}>
      <Icon className="w-3.5 h-3.5" /> {label}
    </button>
  );

  return (
    <AppCtx.Provider value={{ isAdmin, members, depts, settings }}>
      <div className="flex h-screen bg-white text-stone-900 overflow-hidden">
        <main className="flex-1 flex flex-col min-w-0">
          <header className="flex items-center gap-2 px-4 h-11 border-b border-stone-200 shrink-0">
            <button onClick={() => setPage("home")} className="text-sm text-stone-500 hover:text-stone-800">팀원별 프로젝트 관리</button>
            {page !== "home" && (
              <>
                <ChevronRight className="w-3.5 h-3.5 text-stone-300" />
                <span className="text-sm text-stone-800">{crumbs[page]}</span>
              </>
            )}
            <div className="ml-auto flex items-center gap-2">
              <button onClick={() => setSearchOpen(true)} className="p-1.5 rounded hover:bg-stone-100 text-stone-400" aria-label="검색"><Search className="w-4 h-4" /></button>
              <div className="flex items-center gap-0.5 bg-stone-100 rounded-md p-0.5">
                {roleBtn(true, ShieldCheck, "관리자")}
                {roleBtn(false, Eye, "일반 사용자")}
              </div>
              <button onClick={() => setSettingsOpen(true)} className="p-1.5 rounded hover:bg-stone-100 text-stone-400" aria-label="설정"><Settings className="w-4 h-4" /></button>
            </div>
          </header>

          {!isAdmin && (
            <div className="px-4 py-1.5 bg-stone-50 border-b border-stone-200 text-xs text-stone-500 flex items-center gap-1.5">
              <Eye className="w-3.5 h-3.5" /> 읽기 전용 화면입니다. 등록과 수정은 관리자만 할 수 있습니다.
            </div>
          )}

          <div className="flex-1 overflow-y-auto">
            <div className={`h-32 ${cover(settings.cover).css}`} />
            <div className="max-w-5xl mx-auto px-6 lg:px-10 pb-20">
              <div className="-mt-8 mb-6">
                <div className="w-16 h-16 rounded-lg bg-white border border-stone-200 shadow-sm flex items-center justify-center text-3xl mb-3">{heading.icon}</div>
                <h1 className="text-3xl font-bold text-stone-900 tracking-tight">{heading.title}</h1>
                <p className="text-sm text-stone-500 mt-1">{heading.sub}</p>
              </div>

              {page === "home" && (
                <HomePage projects={projects} setProjects={setProjects} setPage={setPage} setMemberId={setMemberId}
                  onAddMember={() => setMemberEdit({ name: "", role: "", email: "", emoji: "🙂", color: "stone" })} focus={null}
                  onOpenProject={openProject} />
              )}
              {page === "member" && (
                <MemberPage memberId={memberId} projects={projects} setProjects={setProjects} setPage={setPage} onEditMember={setMemberEdit} focus={focus} />
              )}
              {page === "dept" && <DeptPage projects={projects} setPage={setPage} setMemberId={setMemberId} />}
              {page === "calendar" && (
                <div className="space-y-4">
                  <div className="flex items-center gap-3 flex-wrap text-xs text-stone-500">
                    {members.map((m) => (
                      <span key={m.id} className="flex items-center gap-1.5"><span className={`w-3 h-3 rounded ${palette(m.color).bar}`} /> {m.name}</span>
                    ))}
                  </div>
                  <MonthCalendar rows={projects} onOpen={(pid, iid) => openProject(pid, iid)} />
                </div>
              )}
            </div>
          </div>
        </main>

        {memberEdit && isAdmin && <MemberModal target={memberEdit} onSave={saveMember} onDelete={removeMember} onClose={() => setMemberEdit(null)} />}
        {gateOpen && (
          <AdminGateModal expected={settings.adminPw}
            onSuccess={() => { setIsAdmin(true); setGateOpen(false); }}
            onClose={() => setGateOpen(false)} />
        )}
        {searchOpen && <SearchModal projects={projects} onGo={go} onClose={() => setSearchOpen(false)} />}
        {settingsOpen && (
          <SettingsModal settings={settings} setSettings={setSettings} depts={depts} setDepts={setDepts}
            members={members} projects={projects}
            onEditMember={setMemberEdit} onAddMember={() => setMemberEdit({ name: "", role: "", email: "", emoji: "🙂", color: "stone" })}
            onClose={() => setSettingsOpen(false)} />
        )}
      </div>
    </AppCtx.Provider>
  );
}

createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
